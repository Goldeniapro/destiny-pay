# Render Blueprint: New > Blueprint > pick this repo. Secrets are typed in the Render dashboard, never committed.
services:
  - type: web
    name: destiny-pay
    runtime: python
    plan: starter            # always on (the free plan sleeps) and allows the persistent disk below
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    disk:                    # the business memory (SQLite) survives deploys and restarts
      name: destiny-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DP_DB_PATH
        value: /var/data/destiny_pay.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID      # after creating the webhook for https://<your-app>/api/paypal/webhook
        sync: false
      - key: FISH_API_KEY           # optional: Destiny Pay's own voice
        sync: false
      - key: FISH_VOICE_ID_ES      # a native voice per language (FISH_VOICE_ID is the fallback)
        sync: false
      - key: FISH_VOICE_ID_EN
        sync: false
      - key: FISH_VOICE_ID_PT
        sync: false
      - key: FISH_VOICE_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: DP_CURRENCY
        value: USD
      - key: DP_EFFORT
        value: low
