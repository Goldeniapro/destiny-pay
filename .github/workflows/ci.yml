name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt pip-audit
      - name: Tests (offline, no keys needed)
        run: pytest -q
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
