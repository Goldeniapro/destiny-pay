<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destiny Pay</title>
<meta name="description" content="Destiny Pay: a multilingual voice cashier and financial copilot that bills, pays and remembers with PayPal.">
<link rel="preload" href="/static/vendor/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <div class="brand">
      <div class="mark" aria-hidden="true">DP</div>
      <div class="brand-text">
        <h1>Destiny <span class="pay">Pay</span></h1>
        <div class="sub" id="tagline"></div>
      </div>
    </div>
    <div class="badges"><span class="badge biz" id="biz-name"></span><span class="badge" id="mode"><span class="dot"></span></span><span class="badge" id="sample-badge" hidden></span><span class="badge" id="voice-badge" hidden></span></div>
    <div class="controls">
      <label class="sr-only" for="lang" id="lang-label">Language</label>
      <select id="lang">
        <option value="es">Español</option><option value="en">English</option><option value="pt">Português</option>
      </select>
      <button type="button" class="icon-btn" id="mute" aria-pressed="false"><svg class="i on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg><svg class="i off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg></button>
      <button type="button" class="icon-btn" id="new-conv"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button type="button" class="icon-btn" id="new-biz"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button>
    </div>
  </div>
</header>
<div class="wrap">
  <p class="notice" id="notice" hidden></p>
  <main>
    <section class="card talk" aria-label="Destiny Pay">
      <div class="voice">
        <button type="button" id="mic" data-state="idle"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0"/><path d="M12 17.5V21"/></svg></button>
        <div><div id="status" aria-live="polite"></div><div id="status-hint"></div></div>
      </div>
      <div class="talk-body">
      <div id="log" role="log" aria-live="polite"></div>
      <div id="cards" aria-live="polite"></div>
      <form id="f">
        <label class="sr-only" for="t" id="t-label">Message</label>
        <input id="t" autocomplete="off" maxlength="2000">
        <button id="send" type="submit"></button>
      </form>
      <div class="chips" id="chips"></div>
      </div>
    </section>
    <section class="dash">
      <div class="kpis" id="kpis"></div>
      <div class="card">
        <div class="chart-head"><h2 id="chart-title"></h2><div class="legend" id="legend"></div></div>
        <svg id="chart" role="img" preserveAspectRatio="none"></svg>
      </div>
      <div class="card">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="panel" data-panel="invoices"><div class="aging" id="aging" hidden></div><div class="grid" id="grid-invoices"></div></div>
        <div class="panel" data-panel="bills" hidden><div class="grid" id="grid-bills"></div></div>
        <div class="panel" data-panel="reminders" hidden><ul class="list" id="reminders"></ul></div>
        <div class="panel" data-panel="contacts" hidden><div class="grid" id="grid-contacts"></div></div>
        <div class="panel" data-panel="activity" hidden><ul class="list" id="activity"></ul></div>
        <div class="panel" data-panel="memory" hidden><ul class="list" id="memory"></ul></div>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
</div>
<dialog id="qr">
  <h2 id="qr-title"></h2>
  <div id="qr-body"></div>
  <p id="qr-link"></p>
  <form method="dialog"><button class="icon-btn" id="qr-close"></button></form>
</dialog>
<audio id="player" preload="none"></audio>
<script src="/static/vendor/ag-grid-community.min.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
