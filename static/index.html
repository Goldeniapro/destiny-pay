<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destiny Pay</title>
<meta name="description" content="Destiny Pay: a multilingual voice cashier and financial copilot that bills, pays and remembers with PayPal.">
<style>
  :root {
    --bg:#f4f6fb; --card:#ffffff; --card2:#f8f9fc; --text:#121829; --muted:#5b6480; --line:#e1e5ef;
    --accent:#2f6fed; --accent-2:#6d4aff; --accent-text:#fff; --me:#e7eeff; --bot:#f2f4f8;
    --ok:#0f7b57; --ok-bg:#ddf5ea; --warn:#9a5b00; --warn-bg:#fff2d6; --bad:#c22f2f; --bad-bg:#fde6e6;
    --idle:#2f6fed; --listen:#d63c3c; --think:#7a5af5; --speak:#0f7b57; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1020; --card:#161b30; --card2:#1b2139; --text:#eef0f8; --muted:#9aa3c2; --line:#2a3154;
      --accent:#6a95ff; --accent-2:#a48bff; --accent-text:#0b1020; --me:#26305c; --bot:#11152a;
      --ok:#4cd6a0; --ok-bg:#103326; --warn:#ffc266; --warn-bg:#3a2a0c; --bad:#ff7b7b; --bad-bg:#3a1515;
      --idle:#6a95ff; --listen:#ff6b6b; --think:#a48bff; --speak:#4cd6a0; --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif; background:var(--bg); color:var(--text); }
  button, select, input { font:inherit; }
  .wrap { max-width:1320px; margin:auto; padding:0 16px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:16px 0 6px; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .logo { width:40px; height:40px; border-radius:12px; flex:none; background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:grid; place-items:center; color:#fff; font-weight:800; }
  h1 { margin:0; font-size:1.35rem; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:.88rem; margin-top:2px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .badge { font-size:.72rem; padding:2px 9px; border-radius:99px; background:var(--card2); color:var(--muted); border:1px solid var(--line); }
  .badge.voice { color:var(--accent-2); }
  .controls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  select, .icon-btn { padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  .notice { margin:8px 0 0; padding:10px 14px; border-radius:12px; background:var(--warn-bg); color:var(--warn); font-size:.88rem; }
  .notice[hidden] { display:none; }
  main { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:16px; padding:14px 0; align-items:start; }
  @media (max-width:980px) { main { grid-template-columns:minmax(0,1fr); } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow); min-width:0; }
  .card h2 { margin:0 0 10px; font-size:1rem; }
  /* voice panel */
  .talk { position:sticky; top:12px; display:flex; flex-direction:column; }
  @media (max-width:980px) { .talk { position:static; } }
  .voice { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  #mic { width:72px; height:72px; flex:none; border-radius:50%; border:0; cursor:pointer; background:var(--idle); color:#fff; font-size:1.7rem; box-shadow:0 6px 18px rgba(47,111,237,.35); transition:transform .15s, background .2s; }
  #mic:hover { transform:scale(1.04); }
  #mic:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  #mic[data-state="listening"] { background:var(--listen); animation:pulse 1.2s infinite; }
  #mic[data-state="thinking"], #mic[data-state="transcribing"] { background:var(--think); }
  #mic[data-state="speaking"] { background:var(--speak); }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(214,60,60,.55); } 70% { box-shadow:0 0 0 18px rgba(214,60,60,0); } 100% { box-shadow:0 0 0 0 rgba(214,60,60,0); } }
  @media (prefers-reduced-motion: reduce) { #mic[data-state="listening"] { animation:none; } }
  #status { font-weight:650; }
  #status-hint { color:var(--muted); font-size:.85rem; margin-top:2px; }
  #log { height:min(46vh,430px); overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px 2px; }
  .msg { padding:9px 12px; border-radius:12px; max-width:90%; line-height:1.42; overflow-wrap:anywhere; }
  .me { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line); }
  .bot.pending { color:var(--muted); font-style:italic; }
  .bot.alert { background:var(--ok-bg); color:var(--ok); border-color:transparent; font-weight:600; }
  .bot.brief { background:linear-gradient(135deg,rgba(47,111,237,.10),rgba(109,74,255,.10)); }
  .bot .play { margin-left:6px; border:0; background:none; color:var(--accent); cursor:pointer; font-size:.85rem; }
  .act { align-self:flex-start; font-size:.75rem; padding:3px 10px; border-radius:99px; background:var(--ok-bg); color:var(--ok); }
  .act.err { background:var(--bad-bg); color:var(--bad); }
  .act.wait { background:var(--warn-bg); color:var(--warn); }
  #cards { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .conf { border:2px solid var(--accent); border-radius:14px; padding:12px; background:var(--card2); }
  .conf h3 { margin:0 0 6px; font-size:.95rem; }
  .conf .who { font-weight:650; }
  .conf .mail { color:var(--muted); font-size:.85rem; overflow-wrap:anywhere; }
  .conf ul { margin:6px 0; padding-left:18px; font-size:.88rem; }
  .conf .total { font-size:1.15rem; font-weight:750; margin:4px 0 8px; }
  .conf .row { display:flex; gap:8px; }
  .conf button { flex:1; padding:10px; border-radius:10px; border:0; cursor:pointer; font-weight:650; }
  .conf .yes { background:var(--accent); color:var(--accent-text); }
  .conf .no { background:var(--bot); color:var(--text); border:1px solid var(--line); }
  .conf .hint { color:var(--muted); font-size:.78rem; margin-top:6px; }
  form { display:flex; gap:8px; margin-top:10px; }
  #t { flex:1; min-width:0; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:1rem; }
  #send { padding:12px 16px; border:0; border-radius:12px; font-weight:650; cursor:pointer; background:var(--accent); color:var(--accent-text); }
  #send:disabled { opacity:.5; cursor:wait; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { font-size:.8rem; padding:6px 10px; border-radius:99px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; text-align:left; }
  .chip:hover { border-color:var(--accent); }
  /* dashboard */
  .kpis { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
  @media (max-width:1180px) { .kpis { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (max-width:560px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:var(--shadow); min-width:0; }
  .kpi .label { color:var(--muted); font-size:.76rem; }
  .kpi .value { font-size:clamp(1.05rem,1.6vw,1.3rem); font-weight:750; margin-top:4px; white-space:nowrap; }
  .kpi .value small { font-size:.62em; font-weight:600; color:var(--muted); margin-left:3px; }
  .kpi .foot { font-size:.75rem; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi .foot.bad { color:var(--bad); } .value.neg { color:var(--bad); } .value.pos { color:var(--ok); }
  .dash { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .chart-head { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .legend { display:flex; gap:12px; font-size:.76rem; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  #chart { width:100%; height:170px; display:block; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin:-4px 0 10px; }
  .tab { border:0; background:none; padding:9px 10px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-weight:600; font-size:.88rem; }
  .tab[aria-selected="true"] { color:var(--accent); border-color:var(--accent); }
  .panel[hidden] { display:none; }
  .grid { height:330px; width:100%; }
  .pill { display:inline-block; padding:1px 9px; border-radius:99px; font-size:.75rem; font-weight:650; background:var(--bot); color:var(--muted); line-height:1.7; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.warn { background:var(--warn-bg); color:var(--warn); } .pill.bad { background:var(--bad-bg); color:var(--bad); }
  .cell-btn { display:inline-block; font-size:.76rem; line-height:1.5; white-space:nowrap; color:var(--accent); background:none; border:1px solid var(--line); border-radius:8px; padding:2px 8px; cursor:pointer; text-decoration:none; margin-right:4px; vertical-align:middle; }
  .list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; max-height:330px; overflow:auto; }
  .list li { padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card2); font-size:.9rem; }
  .list .when { color:var(--muted); font-size:.78rem; margin-right:8px; }
  .empty { color:var(--muted); font-size:.9rem; padding:8px 2px; }
  dialog { border:0; border-radius:16px; padding:18px; background:var(--card); color:var(--text); max-width:340px; width:calc(100% - 32px); text-align:center; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog img { width:240px; height:240px; image-rendering:pixelated; background:#fff; border-radius:10px; padding:8px; }
  footer { color:var(--muted); font-size:.78rem; padding:4px 0 24px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">DP</div>
      <div style="min-width:0">
        <h1>Destiny Pay <span class="sr-only">·</span></h1>
        <div class="sub" id="tagline"></div>
        <div class="badges"><span class="badge" id="biz-name"></span><span class="badge" id="mode"></span><span class="badge" id="sample-badge" hidden></span><span class="badge voice" id="voice-badge" hidden></span></div>
      </div>
    </div>
    <div class="controls">
      <label class="sr-only" for="lang" id="lang-label">Language</label>
      <select id="lang">
        <option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="zh">中文</option><option value="fr">Français</option>
      </select>
      <button type="button" class="icon-btn" id="mute" aria-pressed="false">🔊</button>
      <button type="button" class="icon-btn" id="new-conv">↺</button>
      <button type="button" class="icon-btn" id="new-biz">✦</button>
    </div>
  </header>
  <p class="notice" id="notice" hidden></p>
  <main>
    <section class="card talk" aria-label="Destiny Pay">
      <div class="voice">
        <button type="button" id="mic" data-state="idle">🎙️</button>
        <div><div id="status" aria-live="polite"></div><div id="status-hint"></div></div>
      </div>
      <div id="log" role="log" aria-live="polite"></div>
      <div id="cards" aria-live="polite"></div>
      <form id="f">
        <label class="sr-only" for="t" id="t-label">Message</label>
        <input id="t" autocomplete="off" maxlength="2000">
        <button id="send" type="submit"></button>
      </form>
      <div class="chips" id="chips"></div>
    </section>
    <section class="dash">
      <div class="kpis" id="kpis"></div>
      <div class="card">
        <div class="chart-head"><h2 id="chart-title"></h2><div class="legend" id="legend"></div></div>
        <svg id="chart" role="img" preserveAspectRatio="none"></svg>
      </div>
      <div class="card">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="panel" data-panel="invoices"><div class="grid" id="grid-invoices"></div></div>
        <div class="panel" data-panel="bills" hidden><div class="grid" id="grid-bills"></div></div>
        <div class="panel" data-panel="reminders" hidden><ul class="list" id="reminders"></ul></div>
        <div class="panel" data-panel="contacts" hidden><div class="grid" id="grid-contacts"></div></div>
        <div class="panel" data-panel="activity" hidden><ul class="list" id="activity"></ul></div>
        <div class="panel" data-panel="memory" hidden><ul class="list" id="memory"></ul></div>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
</div>
<dialog id="qr">
  <h2 id="qr-title" style="margin-top:0;font-size:1rem"></h2>
  <div id="qr-body"></div>
  <p id="qr-link"></p>
  <form method="dialog"><button class="icon-btn" id="qr-close"></button></form>
</dialog>
<audio id="player" preload="none"></audio>
<script src="/static/vendor/ag-grid-community.min.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
