<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destiny Pay</title>
<meta name="description" content="Destiny Pay: a multilingual voice cashier that bills customers with PayPal invoices.">
<style>
  :root {
    --bg:#f5f6fa; --card:#ffffff; --text:#151a2d; --muted:#5d6681; --line:#e2e5ef;
    --accent:#2f6fed; --accent-text:#ffffff; --me:#e8efff; --bot:#f3f4f8;
    --ok:#12805c; --ok-bg:#e3f6ee; --warn:#9a5b00; --warn-bg:#fff3dc; --bad:#c22f2f; --bad-bg:#fde8e8;
    --idle:#2f6fed; --listen:#d63c3c; --think:#7a5af5; --speak:#12805c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1220; --card:#181d31; --text:#eef0f7; --muted:#9aa3c0; --line:#2a3152;
      --accent:#5b8cff; --accent-text:#0b1020; --me:#26305a; --bot:#11152a;
      --ok:#4cd6a0; --ok-bg:#123327; --warn:#ffc266; --warn-bg:#3a2a0c; --bad:#ff7b7b; --bad-bg:#3a1515;
      --idle:#5b8cff; --listen:#ff6b6b; --think:#a48bff; --speak:#4cd6a0;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { max-width:1040px; margin:auto; padding:18px 16px 4px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:1.55rem; letter-spacing:-.01em; }
  h1 b { color:var(--accent); }
  .tagline { margin:4px 0 0; color:var(--muted); max-width:620px; }
  .controls { display:flex; gap:8px; align-items:center; }
  select, .icon-btn { font:inherit; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  .badge { display:inline-block; font-size:.75rem; padding:3px 10px; border-radius:99px; background:var(--bot); color:var(--muted); border:1px solid var(--line); vertical-align:middle; margin-left:6px; }
  .notice { max-width:1040px; margin:8px auto 0; padding:0 16px; }
  .notice p { margin:0; padding:10px 14px; border-radius:12px; background:var(--warn-bg); color:var(--warn); font-size:.9rem; }
  main { display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap:16px; padding:16px; max-width:1040px; margin:auto; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0,1fr); } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; min-width:0; }
  .card h2 { margin:0 0 10px; font-size:1.05rem; }
  .voice { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  #mic { width:68px; height:68px; flex:none; border-radius:50%; border:0; cursor:pointer; background:var(--idle); color:#fff; font-size:1.7rem; box-shadow:0 4px 14px rgba(0,0,0,.18); transition:transform .15s, background .2s; }
  #mic:hover { transform:scale(1.04); }
  #mic:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  #mic[data-state="listening"] { background:var(--listen); animation:pulse 1.2s infinite; }
  #mic[data-state="thinking"] { background:var(--think); }
  #mic[data-state="speaking"] { background:var(--speak); }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(214,60,60,.55); } 70% { box-shadow:0 0 0 16px rgba(214,60,60,0); } 100% { box-shadow:0 0 0 0 rgba(214,60,60,0); } }
  @media (prefers-reduced-motion: reduce) { #mic[data-state="listening"] { animation:none; } }
  #status { font-weight:600; }
  #status-hint { color:var(--muted); font-size:.88rem; margin-top:2px; }
  #log { height:360px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px 2px; }
  .msg { padding:9px 12px; border-radius:12px; max-width:88%; line-height:1.4; overflow-wrap:anywhere; }
  .me { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line); }
  .bot.pending { color:var(--muted); font-style:italic; }
  .bot.paid { background:var(--ok-bg); color:var(--ok); border-color:transparent; font-weight:600; }
  .act { align-self:flex-start; font-size:.78rem; padding:3px 10px; border-radius:99px; background:var(--ok-bg); color:var(--ok); }
  .act.err { background:var(--bad-bg); color:var(--bad); }
  form { display:flex; gap:8px; margin-top:12px; }
  #t { flex:1; min-width:0; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:1rem; }
  #send { padding:12px 16px; border:0; border-radius:12px; font-weight:600; cursor:pointer; background:var(--accent); color:var(--accent-text); }
  #send:disabled { opacity:.5; cursor:wait; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { font:inherit; font-size:.82rem; padding:6px 10px; border-radius:99px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; text-align:left; }
  .chip:hover { border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; }
  td.num { white-space:nowrap; }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:.78rem; font-weight:600; background:var(--bot); color:var(--muted); }
  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.warn { background:var(--warn-bg); color:var(--warn); } .pill.bad { background:var(--bad-bg); color:var(--bad); }
  .row-actions { display:flex; flex-wrap:wrap; gap:6px; }
  .row-actions a, .row-actions button { font:inherit; font-size:.8rem; color:var(--accent); background:none; border:1px solid var(--line); border-radius:8px; padding:3px 8px; cursor:pointer; text-decoration:none; }
  .empty { color:var(--muted); font-size:.9rem; padding:12px 0; }
  #qr { margin-top:16px; padding:14px; border-radius:14px; border:1px dashed var(--line); text-align:center; }
  #qr[hidden] { display:none; }
  #qr img { width:220px; height:220px; image-rendering:pixelated; background:#fff; border-radius:8px; padding:8px; }
  #qr .demo-qr { padding:18px; color:var(--muted); font-size:.9rem; }
  #qr-close { float:right; }
  footer { max-width:1040px; margin:0 auto 24px; padding:0 16px; color:var(--muted); font-size:.8rem; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Destiny <b>Pay</b> <span id="mode" class="badge"></span></h1>
    <p class="tagline" id="tagline"></p>
  </div>
  <div class="controls">
    <label class="sr-only" for="lang" id="lang-label">Language</label>
    <select id="lang">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="pt">Português</option>
    </select>
    <button type="button" class="icon-btn" id="mute" aria-pressed="false">🔊</button>
    <button type="button" class="icon-btn" id="reset">↺</button>
  </div>
</header>
<div class="notice" id="notice" hidden><p id="notice-text"></p></div>
<main>
  <section class="card" aria-labelledby="talk-title">
    <h2 id="talk-title" class="sr-only">Destiny Pay</h2>
    <div class="voice">
      <button type="button" id="mic" data-state="idle">🎙️</button>
      <div>
        <div id="status" aria-live="polite"></div>
        <div id="status-hint"></div>
      </div>
    </div>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="f">
      <label class="sr-only" for="t" id="t-label">Message</label>
      <input id="t" autocomplete="off" maxlength="2000">
      <button id="send" type="submit"></button>
    </form>
    <div class="chips" id="chips"></div>
  </section>
  <section class="card" aria-labelledby="inv-title">
    <h2 id="inv-title"></h2>
    <table>
      <thead><tr><th id="th-client"></th><th id="th-total"></th><th id="th-status"></th><th id="th-actions"></th></tr></thead>
      <tbody id="inv"></tbody>
    </table>
    <div class="empty" id="empty"></div>
    <div id="qr" hidden>
      <button type="button" class="icon-btn" id="qr-close">✕</button>
      <h2 id="qr-title"></h2>
      <div id="qr-body"></div>
      <div class="row-actions" id="qr-link" style="justify-content:center;margin-top:8px"></div>
    </div>
  </section>
</main>
<footer id="footer"></footer>

    rate: "You're going too fast. Wait a minute and try again.", server: "The server had a problem. Please try again.", offline: "Can't reach the server. Check your connection and try again.",

    v_nomic: "No microphone found. You can type your request.", v_network: "Dictation needs an internet connection. Type your request meanwhile.", v_generic: "Dictation failed. Try again or type your request.",
    v_unsupported: "This browser has no voice dictation. Use Chrome, Edge or Safari, or type your request.",
    mode_demo: "demo mode", mode_sandbox: "PayPal Sandbox", mode_live: "PayPal Live",
    demo_note: "Demo mode: invoices are simulated in memory. Use “Simulate payment” to see the payment-received alert.",
    ai_off: "The server has no AI key configured yet, so the assistant can't answer.",
    footer: "Demo on PayPal Sandbox: no real money moves. Don't enter real customer data. Built by Innov4AI SAC, Lima, Peru.",
    status: { DRAFT: "Draft", SENT: "Sent", UNPAID: "Unpaid", PARTIALLY_PAID: "Partially paid", PAYMENT_PENDING: "Payment pending", SCHEDULED: "Scheduled", PAID: "Paid", MARKED_AS_PAID: "Paid (recorded)", CANCELLED: "Cancelled", REFUNDED: "Refunded", PARTIALLY_REFUNDED: "Partially refunded", MARKED_AS_REFUNDED: "Refunded" },

  },
  pt: {
    tagline: "Sua caixa por voz: cobre clientes com faturas do PayPal, veja quem te deve e registre pagamentos, só falando.",

    st_idle: "Toque no microfone e fale", st_listening: "Estou ouvindo…", st_thinking: "Pensando…", st_speaking: "Falando… (toque para interromper)",
    hint: "Diga o nome, o e-mail e o que você vendeu. Vou pedir confirmação antes de enviar.",
    thinking: "Pensando…",
    greet: "Oi, eu sou a Destiny Pay. Diga quem devo cobrar, o e-mail e o que você vendeu.",
    examples: ["Cobre a Maria Souza 2 bolos a 15 dólares, e-mail maria arroba exemplo ponto com", "Sim, pode enviar", "Quem me deve?", "Mostre o QR da Maria", "A Maria me pagou 10 dólares em dinheiro", "A Maria já pagou?"],
    invoices: "Faturas desta sessão", th_client: "Cliente", th_total: "Total", th_status: "Status", th_actions: "",
    empty: "Ainda não há faturas. Peça sua primeira cobrança.", pay: "Link de pagamento", show_qr: "QR", simulate: "Simular pagamento",
    qr_title: "Escaneie para pagar com PayPal", qr_demo: "No modo demo não há QR real. Com o PayPal Sandbox, o QR de pagamento da fatura aparece aqui.", close: "Fechar",
    paid: (n, t) => `${n} acabou de te pagar ${t} com PayPal!`,
    rate: "Você está indo rápido demais. Espere um minuto e tente de novo.", server: "O servidor teve um problema. Tente de novo.", offline: "Sem conexão com o servidor. Verifique sua internet e tente de novo.",
    v_denied: "O navegador bloqueou o microfone. Permita na barra de endereço ou digite seu pedido.", v_nospeech: "Não ouvi nada. Toque no microfone e fale de novo.",
    v_nomic: "Não encontrei um microfone. Você pode digitar seu pedido.", v_network: "O ditado precisa de internet. Enquanto isso, digite seu pedido.", v_generic: "O ditado falhou. Tente de novo ou digite seu pedido.",
    v_unsupported: "Este navegador não tem ditado por voz. Use Chrome, Edge ou Safari, ou digite seu pedido.",

    demo_note: "Modo demo: as faturas são simuladas na memória. Use “Simular pagamento” para ver o aviso de pagamento recebido.",

    actions: { draft_invoice: "Rascunho criado", send_invoice: "Fatura enviada", list_invoices: "Faturas consultadas", get_invoice: "Status consultado", remind_invoice: "Lembrete enviado", cancel_invoice: "Fatura cancelada", record_payment: "Pagamento registrado", show_qr: "QR na tela" },
  },
};
const SPEECH_LANG = { es: "es-PE", en: "en-US", pt: "pt-BR" };
const PAID = new Set(["PAID", "MARKED_AS_PAID"]);
const OPEN = new Set(["SENT", "UNPAID", "PARTIALLY_PAID", "PAYMENT_PENDING", "SCHEDULED"]);
const BAD = new Set(["CANCELLED", "REFUNDED", "PARTIALLY_REFUNDED", "MARKED_AS_REFUNDED"]);

const $ = id => document.getElementById(id);
const log = $("log"), input = $("t"), mic = $("mic"), sendBtn = $("send");
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* storage blocked: keep going */ } },
};

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b); else for (let i = 0; i < 16; i++) b[i] = Math.random() * 256 | 0;
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

function initialLang() {
  const saved = store.get("dp_lang");
  if (saved && I18N[saved]) return saved;
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const p = String(l).slice(0, 2).toLowerCase();
    if (I18N[p]) return p;
  }
  return "en";
}

let lang = initialLang();
let sid = store.get("dp_sid") || uuid();
let muted = store.get("dp_muted") === "1";
let demo = false, busy = false, state = "idle", serverStatus = null;
let known = new Map(), rowsById = new Map();
const t = k => I18N[lang][k];

// ---------- UI text ----------
function applyTexts() {
  document.documentElement.lang = lang;
  $("lang").value = lang;
  $("lang-label").textContent = t("lang");
  $("tagline").textContent = t("tagline");
  input.placeholder = t("placeholder");
  $("t-label").textContent = t("message");
  sendBtn.textContent = t("send");
  $("inv-title").textContent = t("invoices");
  $("th-client").textContent = t("th_client"); $("th-total").textContent = t("th_total");
  $("th-status").textContent = t("th_status"); $("th-actions").textContent = t("th_actions");
  $("qr-title").textContent = t("qr_title");
  $("qr-close").setAttribute("aria-label", t("close"));
  $("footer").textContent = t("footer");
  $("status-hint").textContent = SR ? t("hint") : t("v_unsupported");
  if (!SR) mic.title = t("v_unsupported");
  updateMute();
  $("reset").setAttribute("aria-label", t("reset"));
  $("reset").title = t("reset");
  applyStatus();
  const chips = $("chips"); chips.textContent = "";
  for (const ex of t("examples")) {
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip"; c.textContent = ex;
    c.addEventListener("click", () => { cancelListening(); send(ex); });
    chips.appendChild(c);
  }
  setState(state);
}

function setState(s) {
  state = s;
  if (s === "idle" && pendingSpeech.length && !busy) setTimeout(flushSpeech, 250);
  mic.dataset.state = s;
  $("status").textContent = t("st_" + s);
  mic.setAttribute("aria-label", s === "listening" ? t("mic_stop") : t("mic_start"));
  mic.setAttribute("aria-pressed", s === "listening" ? "true" : "false");
  sendBtn.disabled = busy;
}

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

function addAction(a) {
  const d = document.createElement("div");
  const label = t("actions")[a.tool] || a.tool;
  d.className = "act" + (a.error ? " err" : "");
  d.textContent = a.error ? `⚠ ${label}: ${a.error}` : `✓ ${label}`;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

function applyStatus() {
  if (!serverStatus) return;
  demo = !!serverStatus.demo_mode;
  $("mode").textContent = demo ? t("mode_demo") : (serverStatus.paypal_env === "live" ? t("mode_live") : t("mode_sandbox"));
  notice(!serverStatus.ai_ready ? t("ai_off") : demo ? t("demo_note") : "");
}

function notice(text) {
  $("notice").hidden = !text;
  $("notice-text").textContent = text || "";
}

// ---------- speech output ----------
let voices = [], speakTimer = null, currentUtt = null, pendingSpeech = [], speechUnlocked = false;

// iOS Safari only speaks after speech was started inside a user gesture: do it once, silently.
function unlockSpeech() {
  if (speechUnlocked || !("speechSynthesis" in window)) return;
  speechUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* not supported */ }
}

function flushSpeech() {
  if (state === "idle" && !busy && pendingSpeech.length) speak(pendingSpeech.shift());
}

// Speak now if nothing else is happening; otherwise wait for the current reply to finish.
function sayWhenIdle(text) {
  if (state === "idle" && !busy) speak(text); else pendingSpeech.push(text);
}
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function pickVoice() {
  const exact = SPEECH_LANG[lang].toLowerCase();
  const norm = v => String(v.lang || "").toLowerCase().replace("_", "-");
  return voices.find(v => norm(v) === exact) || voices.find(v => norm(v).startsWith(lang)) || null;
}

function speak(text) {
  if (muted || !text || !("speechSynthesis" in window)) { setState("idle"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v) u.voice = v;
  u.lang = v ? v.lang : SPEECH_LANG[lang];
  currentUtt = u;
  const done = () => {
    if (currentUtt !== u) return;  // a cancelled, older utterance must not end the new one
    currentUtt = null;
    clearTimeout(speakTimer);
    if (state === "speaking") setState("idle");
  };
  u.onend = done; u.onerror = done;
  setState("speaking");
  setTimeout(() => { if (currentUtt === u) speechSynthesis.speak(u); }, 60);  // Chrome can drop an utterance queued right after cancel()
  clearTimeout(speakTimer);
  speakTimer = setTimeout(done, 3000 + text.length * 75);  // some browsers never fire onend
}

function stopSpeaking() {
  currentUtt = null;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  clearTimeout(speakTimer);
  if (state === "speaking") setState("idle");
}

function updateMute() {
  const b = $("mute");
  b.textContent = muted ? "🔇" : "🔊";
  b.setAttribute("aria-pressed", muted ? "true" : "false");
  b.setAttribute("aria-label", muted ? t("unmute") : t("mute"));
  b.title = b.getAttribute("aria-label");
}

// ---------- speech input ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, finalText = "", recError = null, recCancelled = false;

function startListening() {
  if (!SR || busy) return;
  pendingSpeech = [];
  stopSpeaking();  // barge-in: never listen while the assistant is talking (no echo)
  finalText = ""; recError = null; recCancelled = false; input.value = "";
  rec = new SR();
  rec.lang = SPEECH_LANG[lang];
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 1;
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    input.value = (finalText + " " + interim).trim();
  };
  rec.onerror = e => { recError = e.error; };
  rec.onend = () => {
    rec = null;
    if (recCancelled) {  // the owner cancelled, or a chip / typed message took over
      recCancelled = false; finalText = "";
      if (state === "listening") { input.value = ""; setState("idle"); }
      return;
    }
    const text = (finalText || input.value).trim();
    if (text) { send(text); return; }
    setState("idle");
    const key = { "not-allowed": "v_denied", "service-not-allowed": "v_denied", "no-speech": "v_nospeech", "audio-capture": "v_nomic", "network": "v_network" }[recError];
    if (recError && recError !== "aborted") add("bot", t(key || "v_generic"));
    recError = null;
  };
  try { rec.start(); setState("listening"); } catch (e) { rec = null; setState("idle"); add("bot", t("v_generic")); }
}

function stopListening() { if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } } }  // sends what was heard
function cancelListening() {  // discards what was heard
  if (!rec) return;
  recCancelled = true;
  try { rec.abort(); } catch (e) { rec = null; recCancelled = false; setState("idle"); }
}

mic.addEventListener("click", () => {
  unlockSpeech();
  if (state === "listening") stopListening();
  else startListening();  // while speaking, this interrupts the assistant and listens right away
});
if (!SR) mic.disabled = true;

// ---------- chat ----------
async function send(text) {
  text = String(text || "").trim();
  if (!text || busy) return;
  unlockSpeech();
  pendingSpeech = [];
  stopSpeaking();
  busy = true; input.value = "";
  add("me", text);
  const wait = add("bot pending", t("thinking"));
  setState("thinking");
  let data;
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid, message: text, lang }),
    });
    if (r.status === 429) data = { reply: t("rate"), error: "rate" };
    else if (!r.ok) data = { reply: t("server"), error: "server" };
    else data = await r.json();
  } catch (e) {
    data = { reply: t("offline"), error: "offline" };
  }
  wait.remove();
  for (const a of data.actions || []) addAction(a);
  for (const u of data.ui || []) if (u && u.qr_png_base64) showQR(u);
  const reply = data.reply || t("server");
  add("bot", reply);
  if (data.error && data.error !== "session_full" && !(data.actions || []).length) input.value = text;  // nothing happened: let the owner resend it
  busy = false;
  speak(reply);
  if (data.error === "session_full") { newSession(true); return; }
  refresh();
}

$("f").addEventListener("submit", e => { e.preventDefault(); const text = input.value; cancelListening(); send(text); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { cancelListening(); pendingSpeech = []; stopSpeaking(); } });

// ---------- invoices ----------
function pillClass(s) { return PAID.has(s) ? "ok" : OPEN.has(s) ? "warn" : BAD.has(s) ? "bad" : ""; }

function render(rows) {
  const body = $("inv"); body.textContent = "";
  rowsById = new Map(rows.map(r => [r.id, r]));
  $("empty").textContent = rows.length ? "" : t("empty");
  for (const i of rows.slice().reverse()) {
    const tr = document.createElement("tr");
    const c1 = document.createElement("td"); c1.textContent = i.recipient || "";
    const c2 = document.createElement("td"); c2.className = "num"; c2.textContent = i.total || "";
    const c3 = document.createElement("td");
    const pill = document.createElement("span"); pill.className = "pill " + pillClass(i.status);
    pill.textContent = t("status")[i.status] || i.status || ""; c3.appendChild(pill);
    const c4 = document.createElement("td");
    const box = document.createElement("div"); box.className = "row-actions";
    if (i.payer_link && OPEN.has(i.status)) {
      const a = document.createElement("a"); a.href = i.payer_link; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = t("pay");
      box.appendChild(a);
    }
    if (demo && OPEN.has(i.status)) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = t("simulate");
      b.addEventListener("click", () => simulatePay(i.id, b));
      box.appendChild(b);
    }
    c4.appendChild(box);
    tr.append(c1, c2, c3, c4);
    body.appendChild(tr);
  }
}

async function refresh() {
  let rows;
  try {
    const r = await fetch("/api/invoices?session_id=" + encodeURIComponent(sid));
    if (!r.ok) return;
    rows = await r.json();
  } catch (e) { return; }
  if (!Array.isArray(rows)) return;
  render(rows);
  for (const i of rows) {
    const prev = known.get(i.id);
    if (prev && prev !== "PAID" && i.status === "PAID") announcePaid(i);
    known.set(i.id, i.status);
  }
}

function announcePaid(i) {
  const text = t("paid")(i.recipient || i.email || "", i.total || "");
  add("bot paid", text);
  sayWhenIdle(text);
}

async function simulatePay(id, btn) {
  btn.disabled = true;
  try { await fetch(`/api/demo/pay/${encodeURIComponent(id)}?session_id=${encodeURIComponent(sid)}`, { method: "POST" }); } catch (e) { /* refresh shows the state */ }
  refresh();
}

function showQR(u) {
  const body = $("qr-body"); body.textContent = "";
  const img = new Image();
  img.alt = t("qr_title");
  img.onload = () => {
    if (img.naturalWidth < 20) {  // demo mode returns a placeholder pixel
      const p = document.createElement("div"); p.className = "demo-qr"; p.textContent = t("qr_demo");
      body.textContent = ""; body.appendChild(p);
    }
  };
  img.src = "data:image/png;base64," + u.qr_png_base64;
  body.appendChild(img);
  const linkBox = $("qr-link"); linkBox.textContent = "";
  const row = rowsById.get(u.invoice_id);
  if (row && row.payer_link) {
    const a = document.createElement("a"); a.href = row.payer_link; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = t("pay");
    linkBox.appendChild(a);
  }
  $("qr").hidden = false;
  $("qr").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
$("qr-close").addEventListener("click", () => { $("qr").hidden = true; });

setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 8000);

// ---------- language & sound ----------
function newSession(keepLog) {
  sid = uuid(); store.set("dp_sid", sid);
  known = new Map(); rowsById = new Map();
  if (!keepLog) log.textContent = "";
  $("qr").hidden = true; render([]);
}

$("lang").addEventListener("change", e => {
  cancelListening(); pendingSpeech = []; stopSpeaking();
  lang = I18N[e.target.value] ? e.target.value : "en";
  store.set("dp_lang", lang);
  newSession();  // the assistant's language is fixed per conversation
  applyTexts();
  add("bot", t("greet"));
});

$("reset").addEventListener("click", () => {
  if (busy) return;
  cancelListening(); pendingSpeech = []; stopSpeaking();
  newSession();
  add("bot", t("greet"));
});

$("mute").addEventListener("click", () => {
  muted = !muted; store.set("dp_muted", muted ? "1" : "0");
  if (muted) stopSpeaking();
  updateMute();
});

// ---------- start ----------
store.set("dp_sid", sid); store.set("dp_lang", lang);
applyTexts();
add("bot", t("greet"));
fetch("/api/status").then(r => r.json()).then(s => {
  serverStatus = s;
  applyStatus();
  refresh();
}).catch(() => refresh());
</script>
</body>
</html>
